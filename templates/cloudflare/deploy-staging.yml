# MakeItShip caller — cloudflare. Copy into .github/workflows/ and replace the
# placeholders: __WORKER_NAME__.
# Contract: staging deploys on every push to the staging branch; "Staging" in the name.
# The deploy itself lives in ai-lab-development-bot/makeitship-actions (@v1).
name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: write
    uses: ai-lab-development-bot/makeitship-actions/.github/workflows/deploy.yml@v1
    with:
      environment: staging
      host: cloudflare
      cloudflare_worker_name: __WORKER_NAME__-staging
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
