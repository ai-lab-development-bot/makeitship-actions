# MakeItShip caller — vercel. Copy into .github/workflows/ and replace the
# placeholders: __VERCEL_ORG_ID__, __VERCEL_PROJECT_ID__, __VERCEL_STAGING_ALIAS__.
# Contract: the file name, the four inputs (backup_key declared, unused) and `change <row_id>` in the run name — MakeItShip's Roll back depends on them.
# The deploy itself lives in ai-lab-development-bot/makeitship-actions (@v1).
name: Rollback
run-name: "Rollback ${{ inputs.target_environment }} — change ${{ inputs.row_id }}"

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to roll back.
        required: true
        type: string
      target_ref:
        description: Commit to redeploy.
        required: true
        type: string
      backup_key:
        description: Unused for code-only sites; declared because MakeItShip always sends it.
        required: false
        type: string
        default: ""
      row_id:
        description: The MakeItShip change this rollback closes.
        required: true
        type: string

concurrency:
  group: deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: write
    uses: ai-lab-development-bot/makeitship-actions/.github/workflows/deploy.yml@v1
    with:
      environment: ${{ inputs.target_environment }}
      target_ref: ${{ inputs.target_ref }}
      deployed_sha: ${{ inputs.target_ref }}
      allowed_deployers: ${{ vars.PRODUCTION_DEPLOYERS }}
      host: vercel
      vercel_org_id: __VERCEL_ORG_ID__
      vercel_project_id: __VERCEL_PROJECT_ID__
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
