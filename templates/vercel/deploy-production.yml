# MakeItShip caller — vercel. Copy into .github/workflows/ and replace the
# placeholders: __VERCEL_ORG_ID__, __VERCEL_PROJECT_ID__, __VERCEL_STAGING_ALIAS__.
# Contract: workflow_dispatch ONLY (never a push trigger); the tag and triggered_by inputs; "Production" in the name. MakeItShip's Publish dispatches it at the vX.Y.Z tag.
# The deploy itself lives in ai-lab-development-bot/makeitship-actions (@v1).
name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release version tag (sent by MakeItShip's Publish).
        required: false
        type: string
      triggered_by:
        description: Who published the release (sent by MakeItShip's Publish).
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: write
    uses: ai-lab-development-bot/makeitship-actions/.github/workflows/deploy.yml@v1
    with:
      environment: production
      version: ${{ inputs.tag }}
      require_version_tag: true
      allowed_deployers: ${{ vars.PRODUCTION_DEPLOYERS }}
      host: vercel
      vercel_org_id: __VERCEL_ORG_ID__
      vercel_project_id: __VERCEL_PROJECT_ID__
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
